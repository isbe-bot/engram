server:
  bind: "127.0.0.1"
  port: 8787
  # Legacy single admin token. Prefer scoped api_keys below for production.
  # Clients send: Authorization: Bearer <token>
  api_key: ""
  # Optional scoped tokens. Uncomment and set unique tokens when networked.
  # api_keys:
  #   - name: read-client
  #     token: ""
  #     scopes: [read]
  #   - name: writer
  #     token: ""
  #     scopes: [read, write]
  #   - name: operator
  #     token: ""
  #     scopes: [admin]
  # Maximum JSON request body size for write endpoints (1 MiB default).
  max_body_bytes: 1048576
  # Optional per-client request limit across authenticated endpoints; 0 disables.
  rate_limit_per_minute: 0

storage:
  sqlite_path: "./data/engram.sqlite"
  qdrant_url: "http://127.0.0.1:6333"
  qdrant_collection: "engram_memory"

ingestion:
  max_batch_size: 200
  worker_count: 2

quality:
  eval_interval: "24h"
