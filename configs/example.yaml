server:
  bind: "127.0.0.1"
  port: 8787
  # Optional but strongly recommended if ENGRAM is reachable by anything
  # other than trusted local processes. Clients send: Authorization: Bearer <api_key>
  api_key: ""
  # Maximum JSON request body size for write endpoints (1 MiB default).
  max_body_bytes: 1048576
  # Optional per-client request limit across authenticated endpoints; 0 disables.
  rate_limit_per_minute: 0

storage:
  sqlite_path: "/srv/aileun/clients/example/runtime/db/engram.sqlite"
  qdrant_url: "http://127.0.0.1:6333"
  qdrant_collection: "engram_memory"

ingestion:
  max_batch_size: 200
  worker_count: 2

quality:
  eval_interval: "24h"
