services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - ./data/qdrant:/qdrant/storage

  engramd:
    build: .
    depends_on:
      - qdrant
    ports:
      - "8787:8787"
    environment:
      ENGRAM_SERVER_BIND: "0.0.0.0"
      ENGRAM_SQLITE_PATH: "/app/data/engram.sqlite"
      ENGRAM_QDRANT_URL: "http://qdrant:6333"
      ENGRAM_QDRANT_COLLECTION: "engram_memory"
      ENGRAM_RATE_LIMIT_PER_MINUTE: "120"
      # Set before exposing beyond local development.
      ENGRAM_API_KEY: ""
    volumes:
      - ./data:/app/data
